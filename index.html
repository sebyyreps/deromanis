    G = ["<div id=hlpprm>Click anywhere to hide this help text.</div><br><div id=hlpttl>Setting up your test</div>Click the highlighted red text to show what options are available, and choose one.<br><br>A test on 'all words' in a Chapter includes only those words that have not appeared in the course before the Chapter you have chosen.<br><br>Note that although macra (the long line over some vowels) are shown in the display to indicate syllables that have a long pronunciation, you do not need to type the macra. All you need to type are letters (a - z), hyphen (-), apostrophe ('), and space.<br><br>Click the START button to begin your test, or click REVIEW to see the list of words you will be tested on.", "<div id=hlpprm>Click anywhere to hide this help text.</div><br><div id=hlpttl>Type-in test</div>Type in your answer for translating the word in blue at the top, and then press return. If your answer is correct, it will be marked and you will move directly to the next question. If you got the answer wrong then some possible answers are listed. When you are ready press return again to move on to the next question.<br><br>Click STOP to end your test early.", "<div id=hlpprm>Click anywhere to hide this help text.</div><br><div id=hlpttl>Multiple-choice test</div>Three choices are given for translating the word in blue at the top. Click the right answer and you will move straight on to the next question. If you click the wrong answer, the right answer will be shown and you must click this correct answer to move on to the next question.<br><br>Click STOP to end your test early.", "<div id=hlpprm>Click anywhere to hide this help text.</div><br><div id=hlpttl>Results of your test</div>All the questions you attempted are listed, showing whether you got the answer right or wrong.<br><br>Click SETUP to configure and start another test.", "<div id=hlpprm>Click anywhere to hide this help text.</div><br><div id=hlpttl>Reviewing the words for your test</div>Click SETUP to go back #drres{display:none;height:70vh;overflow:auto;}
#drres .drwrap{width:min(700px,86vw);margin:5vh auto;}
#drres h2{font-family:Cinzel,"Trajan Pro",Georgia,"Times New Roman",serif;color:#b62432;font-size:1.3em;letter-spacing:.08em;margin:0 0 .8em;}
#drres .drcard{border:1px solid #ccc;background:#f6f6f6;padding:.8em 1em;margin-bottom:1em;}
#drres .drname{font-weight:bold;color:#800000;margin-bottom:.3em;}
#drres .drdesc{color:#555;font-size:.8em;line-height:1.35;margin-bottom:.7em;}
#drres .drempty{color:#555;font-size:.9em;line-height:1.4;}
.drbtn{display:inline-block;background:#b62432;color:#fff;padding:.35em .9em;margin:0 .5em .3em 0;cursor:pointer;font-size:.85em;}
.drbtn:hover{background:#eee;color:#a00;}
.drbtn.drgrey{background:#888;}
#drbar{display:none;position:fixed;bottom:0;height:10vh;width:100%;background:#b62432;}
#drbar .genbtn{border:0;}

#drafter .drmsg{color:#555;font-size:.85em;margin:.2em 0 .5em;}
span.drspell{color:#c00000;font-weight:bold;}
</style>
<script>
(function () {
  // Embedded resources: [title, description, id of the base64 <script> in <head>, download name]
  var RES = [
    ["Latin Indicative Verb Endings",
     "Two A4 sheets: active (sheet 1) and passive (sheet 2) indicative, all six tenses, for the 1st, 2nd, 3rd and 4th conjugations. Stem in black, ending in red. Print and stick in your book.",
     "drpdf-endings", "latin_verb_endings_indicative.pdf"]
  ];
  var STORE = "drSavedSets", urls = {}, savedHdr = "", lastMissed = [];

  function $(id) { return document.getElementById(id); }
  function show(id, on) { $(id).style.display = on ? "" : "none"; }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function plain(html) { var d = document.createElement("div"); d.innerHTML = html; return d.textContent; }

  // ---- saved sets (this browser only) ------------------------------------
  function loadSets() {
    try { var v = JSON.parse(localStorage.getItem(STORE) || "[]"); return Array.isArray(v) ? v : []; }
    catch (e) { return []; }
  }
  function saveSets(sets) {
    try { localStorage.setItem(STORE, JSON.stringify(sets)); return true; } catch (e) { return false; }
  }
  // words are stored as [latin, english] so a saved set still works if the word list is reordered
  function toIndices(words) {
    var D = window.drData, key = {}, out = [];
    for (var j = 0; j < D.n; j++) key[D.lat[j] + "\u0001" + D.eng[j]] = j;
    words.forEach(function (w) { var j = key[w[0] + "\u0001" + w[1]]; j !== undefined && out.push(j); });
    return out;
  }
  function chaptersOf(idx) {
    var seen = {}, list = [];
    idx.forEach(function (j) { var c = window.drData.ch[j]; seen[c] || (seen[c] = 1, list.push(c)); });
    return list.sort(function (a, b) { return a - b; });
  }

  function practise(idx) {
    if (!idx.length) return;
    window.drPool = idx.slice();
    hidePanel();
    window.drStart();
  }

  // ---- results screen: redo / save the missed words -----------------------
  window.drAfterRun = function (missed) {
    var seen = {}, idx = [];
    missed.forEach(function (j) { seen[j] || (seen[j] = 1, idx.push(j)); });
    lastMissed = idx;
    var box = document.createElement("div");
    box.id = "drafter";
    box.innerHTML = idx.length
      ? "<span class=drbtn id=drredo>REDO MISSED WORDS (" + idx.length + ")</span>" +
        "<span class=drbtn id=drsave>SAVE MISSED WORDS TO PRACTISE LATER</span><div class=drmsg id=drsavemsg></div>"
      : "<div class=drmsg>No missed words. Well done!</div>";
    var res = $("result");
    res.insertBefore(box, res.firstChild);
  };

  function saveMissed() {
    if (!lastMissed.length) return;
    var D = window.drData, now = new Date(), chs = chaptersOf(lastMissed);
    var sets = loadSets();
    sets.unshift({
      name: "Missed words, chapter" + (chs.length > 1 ? "s " : " ") + chs.join(", "),
      saved: now.toISOString(),
      words: lastMissed.map(function (j) { return [D.lat[j], D.eng[j]]; })
    });
    var ok = saveSets(sets);
    $("drsavemsg").textContent = ok
      ? "Saved. Find them under PRACTICE on the setup screen."
      : "Couldn't save: this browser is blocking saved data (private window?).";
    if (ok) { var b = $("drsave"); b.className = "drbtn drgrey"; b.id = "drsaved"; b.textContent = "SAVED"; }
  }

  // ---- spelling check (same rules as the De Romanis site) -----------------
  function lev(a, b) {
    var m = a.length, n = b.length, d = [], i, j;
    if (!m) return n; if (!n) return m;
    if (Math.abs(m - n) > 2) return 9;
    for (i = 0; i <= m; i++) d[i] = [i];
    for (j = 0; j <= n; j++) d[0][j] = j;
    for (i = 1; i <= m; i++) for (j = 1; j <= n; j++) {
      d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
      if (i > 1 && j > 1 && a[i - 1] === b[j - 2] && a[i - 2] === b[j - 1]) d[i][j] = Math.min(d[i][j], d[i - 2][j - 2] + 1);
    }
    return d[m][n];
  }
  var otherAnswers = {};
  function allAnswers(dir) {   // every word's accepted answers, so a real (different) word never counts as a typo
    if (!otherAnswers[dir]) {
      var D = window.drData, set = {}, j;
      for (j = 0; j < D.n; j++) {
        (dir === 1 ? D.latAns[j].split(":").map(function (x) { return x.split("^")[0]; }) : D.engAns[j].split(":"))
          .forEach(function (x) { x && (set[x] = 1); });
      }
      otherAnswers[dir] = set;
    }
    return otherAnswers[dir];
  }
  // typed: the checker's cleaned answer ("part,part"); accepted: ":ans:ans:"; dir: 1 = English to Latin
  window.drSpellClose = function (typed, accepted, dir) {
    var acc = accepted.split(":").filter(Boolean), others = allAnswers(dir), fuzzy = false;
    var ok = typed.split(",").every(function (u) {
      if (acc.indexOf(u) !== -1) return true;
      if (u.length < 4 || others[u]) return false;
      return acc.some(function (c) {
        if (c.length < 4) return false;
        var thr = c.length >= 11 ? 3 : c.length >= 7 ? 2 : 1;
        return lev(u, c) <= thr && (fuzzy = true);
      });
    });
    return ok && fuzzy;
  };

  // ---- panels: Resources and Practice -------------------------------------
  function blobUrl(id) {
    if (!urls[id]) {
      var b = atob($(id).textContent.trim()), a = new Uint8Array(b.length);
      for (var i = 0; i < b.length; i++) a[i] = b.charCodeAt(i);
      urls[id] = URL.createObjectURL(new Blob([a], { type: "application/pdf" }));
    }
    return urls[id];
  }

  function resHtml() {
    var html = "<h2>RESOURCES</h2>";
    RES.forEach(function (r, i) {
      html += "<div class=drcard><div class=drname>" + r[0] + "</div><div class=drdesc>" + r[1] + "</div>" +
        "<span class=drbtn id=dropen" + i + ">OPEN</span><span class=drbtn id=drdl" + i + ">DOWNLOAD</span></div>";
    });
    return html;
  }

  function pracHtml() {
    var sets = loadSets(), html = "<h2>PRACTICE</h2>";
    if (!sets.length) {
      return html + "<div class=drempty>No saved words yet. At the end of a test, press " +
        "<b>SAVE MISSED WORDS TO PRACTISE LATER</b> and they will appear here.<br><br>" +
        "Saved words are kept in this browser on this computer.</div>";
    }
    sets.forEach(function (s, i) {
      var when = new Date(s.saved), n = s.words.length;
      var list = s.words.slice(0, 8).map(function (w) { return plain(w[0]).split(",")[0]; }).join(", ") + (n > 8 ? ", …" : "");
      html += "<div class=drcard><div class=drname>" + esc(s.name) + "</div><div class=drdesc>" + n + " word" + (n === 1 ? "" : "s") +
        " &middot; saved " + esc(when.toLocaleDateString(undefined, { day: "numeric", month: "short" })) + " " +
        esc(when.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" })) + "<br>" + esc(list) + "</div>" +
        "<span class=drbtn id=drprac" + i + ">PRACTISE</span><span class=\"drbtn drgrey\" id=drdel" + i + ">DELETE</span></div>";
    });
    return html;
  }

  var current = "";
  function fill() { $("drres").firstChild.innerHTML = current === "res" ? resHtml() : pracHtml(); }

  window.drShowPanel = function (kind) {
    current = kind;
    savedHdr = $("hdr").innerHTML;
    $("hdr").innerHTML = "De Romanis: " + (kind === "res" ? "Resources" : "Practice your saved words");
    fill();
    show("innr", false); show("btndiv", false);
    $("drres").style.display = "block";
    $("drbar").style.display = "flex";
  };
  function hidePanel() {
    if ($("drres").style.display !== "block") return;
    $("hdr").innerHTML = savedHdr;
    show("drres", false); show("drbar", false);
    show("innr", true); show("btndiv", true);
  }

  function build() {
    var panel = document.createElement("div");
    panel.id = "drres";
    panel.innerHTML = "<div class=drwrap></div>";
    var bar = document.createElement("div");
    bar.id = "drbar";
    bar.innerHTML = "<span id=drback class=genbtn>BACK</span>";
    document.body.appendChild(panel);
    document.body.appendChild(bar);
    bar.addEventListener("click", hidePanel);

    panel.addEventListener("click", function (e) {
      var m = /^dr(open|dl|prac|del)(\d+)$/.exec(e.target.id || "");
      if (!m) return;
      var i = +m[2];
      if (m[1] === "prac") return practise(toIndices(loadSets()[i].words));
      if (m[1] === "del") { var s = loadSets(); s.splice(i, 1); saveSets(s); return fill(); }
      var r = RES[i], url = blobUrl(r[2]);
      if (m[1] === "open") { window.open(url, "_blank"); return; }
      var a = document.createElement("a");
      a.href = url; a.download = r[3];
      document.body.appendChild(a); a.click(); a.remove();
    });

    // results-screen buttons live inside #result, which the tester rebuilds each run
    document.addEventListener("click", function (e) {
      if (e.target.id === "drredo") practise(lastMissed);
      else if (e.target.id === "drsave") saveMissed();
    });
  }

  if ($("btndiv")) build();
  else document.addEventListener("DOMContentLoaded", build);
})();
</script>
